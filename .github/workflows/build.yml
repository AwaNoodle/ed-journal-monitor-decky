name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    # Pinned: ubuntu-26.04 (ubuntu-latest) has no Python 3.9, our CI floor.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Install Node dependencies
        run: npm ci

      - name: Lint + typecheck frontend
        run: npm run lint:ts

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint backend
        run: ruff check src/modules/ tests/

      - name: Run Python tests
        run: PYTHONPATH=. python -m pytest tests/ -v

      - name: Build and package
        run: npm run package


