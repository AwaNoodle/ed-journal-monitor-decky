name: Release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Node dependencies
        run: npm ci

      - name: Lint + typecheck frontend
        run: npm run lint:ts

      - name: Install Python dependencies
        run: pip install ruff pytest pytest-asyncio

      - name: Lint backend
        run: ruff check src/modules/ tests/

      - name: Run Python tests
        run: PYTHONPATH=. python -m pytest tests/ -v

      - name: Build and package
        run: npm run package

      - name: Rename zip with version
        run: mv ed-journal-monitor.zip ed-journal-monitor-decky-${{ github.event.release.tag_name }}.zip

      - name: Upload release asset
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ed-journal-monitor-decky-${{ github.event.release.tag_name }}.zip
