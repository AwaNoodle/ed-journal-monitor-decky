name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # On a tag push this is `github.ref_name` (e.g. v0.6.0); on a manual
      # GitHub Release it is the release's tag. One var covers both triggers.
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      # fetch-depth: 0 so the ancestry check below has real history to walk.
      # A shallow clone can report a wrong answer when the merge base lies
      # beyond the fetched depth.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag matching v* fires this workflow wherever it points, so without
      # this a tag on an unmerged branch would publish a release from code
      # that never went through a PR. Releases come from `main` only.
      - name: Verify tag is on main
        run: |
          # Compare against FETCH_HEAD, not origin/main: checking out a tag
          # leaves a narrow fetch refspec, under which `git fetch origin main`
          # never creates refs/remotes/origin/main. Naming it would abort with
          # "Needed a single revision" and read as "not on main" - failing
          # every legitimate release for the wrong reason.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$TAG ($GITHUB_SHA) is not on main - releases must be tagged on main"
            exit 1
          fi
          echo "$TAG is on main"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # package.json ships inside the zip and is read at runtime for the EDDN
      # softwareVersion header, so a tag/package.json mismatch publishes a
      # plugin that misreports itself. Fail before the expensive steps.
      - name: Verify tag matches package.json
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "v$pkg" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $pkg"
            exit 1
          fi
          echo "tag $TAG matches package.json $pkg"

      # Extract-release-notes.sh is the same script the release step relies
      # on; run it here too so a missing changelog section fails fast rather
      # than after lint, tests and the full build.
      - name: Verify changelog section exists
        if: github.event_name == 'push'
        run: bash scripts/extract-release-notes.sh "${TAG#v}" CHANGELOG.md > /dev/null

      - name: Install Node dependencies
        run: npm ci

      - name: Lint + typecheck frontend
        run: npm run lint:ts

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint backend
        run: ruff check src/modules/ tests/

      - name: Run Python tests
        run: PYTHONPATH=. python -m pytest tests/ -v

      - name: Build and package
        run: npm run package

      - name: Rename zip with version
        run: mv ed-journal-monitor.zip "ed-journal-monitor-decky-${TAG}.zip"

      # Verify the artifact actually contains a working plugin before it is
      # attached to a release. `jq` and `unzip` are preinstalled on the runner.
      - name: Verify package contents
        run: |
          zip="ed-journal-monitor-decky-${TAG}.zip"
          listing=$(unzip -Z1 "$zip")
          for path in \
            ed-journal-monitor/package.json \
            ed-journal-monitor/plugin.json \
            ed-journal-monitor/main.py \
            ed-journal-monitor/dist/index.js
          do
            printf '%s\n' "$listing" | grep -Fxq "$path" || {
              echo "::error::$path missing from $zip"; exit 1; }
          done
          printf '%s\n' "$listing" | grep -Eq '^ed-journal-monitor/bin/src/modules/.+\.py$' || {
            echo "::error::no backend python modules in $zip"; exit 1; }
          printf '%s\n' "$listing" | grep -Fxq 'ed-journal-monitor/bin/src/modules/watcher.py' || {
            echo "::error::ed-journal-monitor/bin/src/modules/watcher.py missing from $zip"; exit 1; }
          zipped=$(unzip -p "$zip" ed-journal-monitor/package.json | jq -r .version)
          if [ "v$zipped" != "$TAG" ]; then
            echo "::error::bundled package.json is $zipped, expected ${TAG#v}"
            exit 1
          fi
          echo "$zip verified: version $zipped, all expected paths present"

      # On a tag push, create the GitHub Release. Its notes come from the
      # matching CHANGELOG.md section; extract-release-notes.sh fails the job
      # if that section is missing rather than publishing bare notes. A
      # release created here with GITHUB_TOKEN does NOT re-trigger the
      # `release: published` job, so no double run.
      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        run: |
          version="${TAG#v}"
          bash scripts/extract-release-notes.sh "$version" CHANGELOG.md > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, updating its notes and publishing it"
            gh release edit "$TAG" --draft=false --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          fi

      - name: Upload release asset
        run: gh release upload "$TAG" "ed-journal-monitor-decky-${TAG}.zip" --clobber
